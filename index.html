<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhseccs Private Banking</title>
<style>
body{font-family:Arial;background:#e8f0f8;margin:0;padding:20px;}
.header{background:#0d2b4a;color:#fff;text-align:center;padding:15px;border-radius:8px;margin-bottom:20px;}
.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:15px auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
button{width:100%;padding:12px;background:#c9a227;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:6px 0;}
.btn-dark{background:#0d2b4a;color:#fff;}
.btn-pink{background:#f8d7da;color:#721c24;}
.btn-small{width:auto;display:inline-block;padding:8px 12px;}
.hidden{display:none;}
.bottom-btns{display:flex;gap:8px;margin-top:20px;}
.bottom-btns button{flex:1;}
.pass-row{display:flex;gap:8px;}
.pass-row input{flex:1;}
</style>
</head>
<body>
<div class="header">
  <h2>Nhseccs Private Banking</h2>
  <p>NEBADHAI HIGH SCHOOL Employees Co-operative Credit Society Limited</p>
</div>

<!-- First Page -->
<div class="card" id="first">
  <h3>Society code</h3>
  <div class="pass-row">
    <input type="password" id="scode" placeholder="Society code">
    <button class="btn-small" onclick="toggleShow('scode')">Show</button>
  </div>
  <button class="btn-dark" onclick="openMain()">Open</button>
  <button onclick="alert('Install app feature')">Install app</button>
</div>

<!-- Main -->
<div class="card hidden" id="main">
  <h3>Main</h3>
  <button class="btn-dark" onclick="show('member-login')">Member Login</button>
  <button class="btn-pink" onclick="show('admin-login')">Administrator Login</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('first')">Back</button>
  </div>
</div>

<!-- Admin Login -->
<div class="card hidden" id="admin-login">
  <h3>Administrator Login</h3>
  <div class="pass-row">
    <input type="password" id="a-pass" placeholder="Password">
    <button class="btn-small" onclick="toggleShow('a-pass')">Show</button>
  </div>
  <div class="pass-row">
    <input type="password" id="a-id" placeholder="6-digit ID" maxlength="6">
    <button class="btn-small" onclick="toggleShow('a-id')">Show</button>
  </div>
  <button class="btn-pink" onclick="doAdminLogin()">Administrative login</button>
  <button onclick="show('add-members')">Add members</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('main')">Back</button>
    <button onclick="show('admin-next')">Next</button>
  </div>
</div>

<!-- Admin Next -->
<div class="card hidden" id="admin-next">
  <h3>Administrator Options</h3>
  <button onclick="show('choose-admin')">Choose administrator</button>
  <button onclick="show('change-admin')">Change administrator</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('admin-login')">Back</button>
    <button onclick="saveData()">Save</button>
  </div>
</div>

<!-- Choose Admin -->
<div class="card hidden" id="choose-admin">
  <h3>Choose Administrator</h3>
  <input type="text" id="ca-name" placeholder="Administrator Name">
  <div class="pass-row">
    <input type="password" id="ca-pass" placeholder="Password">
    <button class="btn-small" onclick="toggleShow('ca-pass')">Show</button>
  </div>
  <div class="pass-row">
    <input type="password" id="ca-id" placeholder="6-digit ID" maxlength="6">
    <button class="btn-small" onclick="toggleShow('ca-id')">Show</button>
  </div>
  <button onclick="chooseAdmin()">Set Administrator</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('admin-next')">Back</button>
    <button onclick="saveData()">Save</button>
  </div>
</div>

<!-- Change Admin -->
<div class="card hidden" id="change-admin">
  <h3>Change Administrator</h3>
  <input type="text" id="ch-name" placeholder="New Administrator Name">
  <div class="pass-row">
    <input type="password" id="ch-pass" placeholder="New Password">
    <button class="btn-small" onclick="toggleShow('ch-pass')">Show</button>
  </div>
  <div class="pass-row">
    <input type="password" id="ch-id" placeholder="New 6-digit ID" maxlength="6">
    <button class="btn-small" onclick="toggleShow('ch-id')">Show</button>
  </div>
  <button onclick="changeAdmin()">Update Administrator</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('admin-next')">Back</button>
    <button onclick="saveData()">Save</button>
  </div>
</div>

<!-- Add Members -->
<div class="card hidden" id="add-members">
  <h3>Add Members</h3>
  <input type="text" id="m-name" placeholder="Member Name">
  <button onclick="addMember()">Add Member</button>
  <div id="m-list"></div>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('admin-login')">Back</button>
    <button onclick="saveData()">Save</button>
  </div>
</div>

<!-- Member Login -->
<div class="card hidden" id="member-login">
  <h3>Member Login</h3>
  <select id="ml-name"></select>
  <div class="pass-row">
    <input type="password" id="ml-pass" placeholder="Password">
    <button class="btn-small" onclick="toggleShow('ml-pass')">Show</button>
  </div>
  <button onclick="doMemberLogin()">Login</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('main')">Back</button>
  </div>
</div>

<script>
let members = JSON.parse(localStorage.getItem('nhs_members') || '[]');
let admin = JSON.parse(localStorage.getItem('nhs_admin') || '{"name":"Admin","password":"123456","id":"123456"}');

function saveData(){
  localStorage.setItem('nhs_members', JSON.stringify(members));
  localStorage.setItem('nhs_admin', JSON.stringify(admin));
  alert('Saved');
}

function show(id){
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id === 'member-login') loadMemberNames();
  if(id === 'add-members') showMemberList();
}

function openMain(){
  if(document.getElementById('scode').value.trim() === '123456') show('main');
  else alert('Invalid society code');
}

function logout(){ show('first'); }

function toggleShow(id){
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function doAdminLogin(){
  const pass = document.getElementById('a-pass').value;
  const id = document.getElementById('a-id').value.trim();
  if(pass === admin.password && id === admin.id){
    alert('Admin login successful');
    show('admin-next');
  } else {
    alert('Invalid password or ID');
  }
}

function addMember(){
  const name = document.getElementById('m-name').value.trim();
  if(!name) return;
  if(members.find(m => m.name === name)){ alert('Name exists'); return; }
  members.push({name, password:'123456'});
  document.getElementById('m-name').value = '';
  showMemberList();
  alert('Member added. Password is 123456');
}

function showMemberList(){
  const div = document.getElementById('m-list');
  div.innerHTML = '<h4>Members:</h4>';
  members.forEach(m => div.innerHTML += '<div>' + m.name + '</div>');
}

function chooseAdmin(){
  const name = document.getElementById('ca-name').value.trim();
  const pass = document.getElementById('ca-pass').value;
  const id = document.getElementById('ca-id').value.trim();
  if(!name || !pass || !id){ alert('Fill all fields'); return; }
  admin = {name, password:pass, id};
  alert('Administrator set: ' + name);
  saveData();
}

function changeAdmin(){
  const name = document.getElementById('ch-name').value.trim();
  const pass = document.getElementById('ch-pass').value;
  const id = document.getElementById('ch-id').value.trim();
  if(!name || !pass || !id){ alert('Fill all fields'); return; }
  admin = {name, password:pass, id};
  alert('Administrator changed to: ' + name);
  saveData();
}

function loadMemberNames(){
  const sel = document.getElementById('ml-name');
  sel.innerHTML = '<option value="">Select Name</option>';
  members.forEach(m => {
    const o = document.createElement('option');
    o.value = m.name; o.textContent = m.name; sel.appendChild(o);
  });
}

function doMemberLogin(){
  const name = document.getElementById('ml-name').value;
  const pass = document.getElementById('ml-pass').value;
  const m = members.find(x => x.name === name && x.password === pass);
  if(m) alert('Login successful for ' + m.name);
  else alert('Invalid name or password');
}
</script>
</body>
</html>
