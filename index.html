<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhseccs Private Banking</title>
<style>
body{font-family:'Times New Roman',Times,serif;background:#e8f0f8;margin:0;padding:20px;font-size:14pt;}
.header{background:#0d2b4a;color:#fff;text-align:center;padding:15px;border-radius:8px;margin-bottom:20px;}
.card{background:#fff;padding:20px;border-radius:12px;max-width:600px;margin:15px auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-family:'Times New Roman',Times,serif;font-size:14pt;}
button{padding:10px 14px;background:#c9a227;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px;font-family:'Times New Roman',Times,serif;font-size:14pt;}
.btn-full{width:100%;display:block;}
.btn-dark{background:#0d2b4a;color:#fff;}
.btn-pink{background:#f8d7da;color:#721c24;}
.btn-green{background:#28a745;color:#fff;}
.btn-red{background:#dc3545;color:#fff;}
.btn-small{width:auto;display:inline-block;padding:6px 10px;font-size:12pt;}
.hidden{display:none;}
.bottom-btns{display:flex;gap:8px;margin-top:20px;}
.bottom-btns button{flex:1;}
.member-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;}
.btn-group{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.btn-group button{flex:1;min-width:80px;}
</style>
</head>
<body>
<div class="header">
  <h2>Nhseccs Private Banking</h2>
  <h3>NEBADHAI HIGH SCHOOL</h3>
  <p>Employees Co-operative Credit Society Limited</p>
</div>

<div class="card" id="first">
  <h3>Society code</h3>
  <input type="password" id="scode" placeholder="Society code">
  <button class="btn-full btn-dark" onclick="openMain()">Open</button>
  <button class="btn-full" onclick="alert('Install app')">Install app</button>
</div>

<div class="card hidden" id="main">
  <h3>Main</h3>
  <button class="btn-full btn-dark" onclick="show('member-login')">Member Login</button>
  <button class="btn-full btn-pink" onclick="show('admin-login')">Administrator Login</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('first')">Back</button>
  </div>
</div>

<div class="card hidden" id="admin-login">
  <h3>Administrator Login</h3>
  <button class="btn-full" onclick="show('add-members')">Add members</button>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('main')">Back</button>
  </div>
</div>

<div class="card hidden" id="add-members">
  <h3>Add members</h3>
  <input type="text" id="m-name" placeholder="Member name" oninput="this.value=this.value.toUpperCase()">
  <button class="btn-full" onclick="addMember()">Add member</button>
  <div id="m-list" style="margin-top:15px;"></div>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('admin-login')">Back</button>
    <button onclick="saveData()">Save</button>
  </div>
</div>

<div class="card hidden" id="member-detail">
  <h3 id="detail-title">Member</h3>
  <div class="btn-group">
    <button onclick="setField('share')">Share</button>
    <button onclick="setField('tf')">TF</button>
    <button onclick="setField('gf')">GF</button>
    <button class="btn-dark" onclick="setField('ltl')">LTL</button>
    <button class="btn-pink" onclick="setField('stl')">STL</button>
    <button style="background:#e2d5f1;" onclick="setField('form')">FORM</button>
    <button style="background:#d6d8db;" onclick="setField('admission')">ADMISSION</button>
  </div>
  <p id="current-field">Select a field</p>
  <input type="number" id="field-value" placeholder="Value">
  <button class="btn-full" onclick="saveField()">Save</button>
  <div id="field-display"></div>
  <div class="bottom-btns">
    <button onclick="logout()">Logout</button>
    <button onclick="show('add-members')">Back</button>
    <button onclick="saveData()">Save</button>
  </div>
</div>

<script>
let members = JSON.parse(localStorage.getItem('nhs_members') || '[]');
let currentMember = null;
let currentField = '';

function saveData(){
  localStorage.setItem('nhs_members', JSON.stringify(members));
  alert('Saved');
}

function show(id){
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id === 'add-members') showMemberList();
}

function openMain(){
  if(document.getElementById('scode').value.trim() === '123456') show('main');
  else alert('Invalid society code');
}

function logout(){ show('first'); }

function addMember(){
  const name = document.getElementById('m-name').value.trim().toUpperCase();
  if(!name) return;
  if(members.find(m => m.name === name)){ alert('Name exists'); return; }
  members.push({name, password:'123456', share:0, tf:0, gf:0, ltl:0, stl:0, form:0, admission:0});
  document.getElementById('m-name').value = '';
  showMemberList();
  alert('Member added');
}

function showMemberList(){
  const div = document.getElementById('m-list');
  div.innerHTML = '';
  members.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `<span>${i+1}. ${m.name}</span>
      <div>
        <button class="btn-small btn-green" onclick="openMember(${i})">Open</button>
        <button class="btn-small btn-red" onclick="deleteMember(${i})">Delete</button>
      </div>`;
    div.appendChild(row);
  });
}

function deleteMember(i){
  if(confirm('Delete ' + members[i].name + '?')){
    members.splice(i, 1);
    showMemberList();
  }
}

function openMember(i){
  currentMember = i;
  document.getElementById('detail-title').textContent = members[i].name;
  showFieldDisplay();
  show('member-detail');
}

function setField(field){
  currentField = field;
  document.getElementById('current-field').textContent = 'Enter value for ' + field.toUpperCase();
  document.getElementById('field-value').value = members[currentMember][field] || 0;
}

function saveField(){
  if(!currentField || currentMember === null) return;
  const val = parseFloat(document.getElementById('field-value').value) || 0;
  members[currentMember][currentField] = val;
  showFieldDisplay();
  alert(currentField.toUpperCase() + ' saved: ' + val);
}

function showFieldDisplay(){
  if(currentMember === null) return;
  const m = members[currentMember];
  document.getElementById('field-display').innerHTML = `
    <p><b>Share:</b> ${m.share || 0} &nbsp; <b>TF:</b> ${m.tf || 0} &nbsp; <b>GF:</b> ${m.gf || 0}</p>
    <p><b>LTL:</b> ${m.ltl || 0} &nbsp; <b>STL:</b> ${m.stl || 0} &nbsp; <b>FORM:</b> ${m.form || 0} &nbsp; <b>ADMISSION:</b> ${m.admission || 0}</p>
  `;
}
</script>
</body>
</html>
