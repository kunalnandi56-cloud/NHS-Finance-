<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHS ECCS</title>
<style>
body{font-family:Arial,sans-serif;background:#e8f0f8;margin:0;padding:0;}
.header{background:#0d2b4a;color:#fff;text-align:center;padding:12px;}
.header h1{font-size:16px;margin:4px 0;}
.container{max-width:600px;margin:20px auto;padding:0 15px;}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:15px;}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:6px 0;}
.btn-dark{background:#0d2b4a;color:#fff;}
.btn-pink{background:#f8d7da;color:#721c24;}
.btn-gold{background:#c9a227;color:#1a2a4a;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="header">
  <div style="background:#0d2b4a;color:#fff;display:inline-block;padding:4px 12px;border-radius:4px;font-size:12px;">NHS ECCS · SECURE MEMBER BANKING</div>
  <h1>NEBADHAI HIGH SCHOOL</h1>
  <h1>Employees Co-operative Credit Society Limited</h1>
  <p>Duttapukur · Barasat-I · North 24 Parganas</p>
</div>

<div class="container">
  <div id="s1" class="card">
    <h2>Society code</h2>
    <p>Enter the society code first.</p>
    <input type="password" id="code" placeholder="Society code">
    <button class="btn btn-dark" onclick="if(document.getElementById('code').value.trim()==='123456'){document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');}else{alert('Invalid code');}">Open</button>
  </div>

  <div id="s2" class="card hidden">
    <h3>First page</h3>
    <button class="btn btn-dark" onclick="document.getElementById('s2').classList.add('hidden');document.getElementById('s3').classList.remove('hidden');">Login</button>
    <button class="btn btn-pink" onclick="document.getElementById('s2').classList.add('hidden');document.getElementById('s4').classList.remove('hidden');">Administrative login</button>
    <button class="btn btn-gold" onclick="alert('Change ID')">Change ID</button>
    <button class="btn btn-gold" onclick="alert('Change password')">Change password</button>
  </div>

  <div id="s3" class="card hidden">
    <h2>Login</h2>
    <input type="text" placeholder="Name">
    <input type="password" placeholder="Password">
    <button class="btn btn-dark" onclick="alert('Member login - database next')">Login</button>
    <button class="btn btn-gold" onclick="document.getElementById('s3').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');">Back</button>
  </div>

  <div id="s4" class="card hidden">
    <h2>Administrative login</h2>
    <p>Password and 6-digit ID both required.</p>
    <input type="password" id="apass" placeholder="Password">
    <input type="text" id="aid" placeholder="6-digit ID" maxlength="6">
    <button class="btn btn-pink" onclick="if(document.getElementById('apass').value==='123456' && document.getElementById('aid').value==='123456'){alert('Admin login successful');document.getElementById('s4').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');}else{alert('Invalid');}">Administrative login</button>
    <button class="btn btn-gold" onclick="document.getElementById('s4').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');">Back</button>
  </div>
</div>
</body>
</html>
