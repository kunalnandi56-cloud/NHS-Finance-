<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhseccs Private Banking</title>
<style>
body{font-family:Arial;background:#e8f0f8;margin:0;padding:20px;}
.header{background:#0d2b4a;color:#fff;text-align:center;padding:15px;border-radius:8px;margin-bottom:20px;}
.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:15px auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
button{width:100%;padding:12px;background:#c9a227;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:6px 0;}
.btn-dark{background:#0d2b4a;color:#fff;}
.btn-pink{background:#f8d7da;color:#721c24;}
.hidden{display:none;}
.error{color:red;text-align:center;}
</style>
</head>
<body>
<div class="header">
  <h2>Nhseccs Private Banking</h2>
  <p>NEBADHAI HIGH SCHOOL Employees Co-operative Credit Society Limited</p>
</div>

<div class="card" id="security">
  <h3>Security Gate</h3>
  <input type="password" id="sec-code" placeholder="6-digit security code" maxlength="6">
  <button class="btn-dark" onclick="goMenu()">Continue</button>
  <div id="sec-err" class="error"></div>
</div>

<div class="card hidden" id="menu">
  <h3>Welcome</h3>
  <button class="btn-dark" onclick="goMemberLogin()">Member Login</button>
  <button class="btn-pink" onclick="goAdminLogin()">Administrator Login</button>
</div>

<div class="card hidden" id="member-login">
  <h3>Member Login</h3>
  <select id="m-name"></select>
  <input type="password" id="m-pass" placeholder="Password">
  <button onclick="doMemberLogin()">Login</button>
  <div id="m-err" class="error"></div>
  <button onclick="goMenu()">Back</button>
</div>

<div class="card hidden" id="admin-login">
  <h3>Administrator Login</h3>
  <input type="text" id="a-name" placeholder="Name">
  <input type="password" id="a-pass" placeholder="Password">
  <input type="text" id="a-id" placeholder="6-digit ID" maxlength="6">
  <button class="btn-pink" onclick="doAdminLogin()">Administrative login</button>
  <div id="a-err" class="error"></div>
  <button onclick="goMenu()">Back</button>
</div>

<div class="card hidden" id="admin-dash">
  <h3>Admin Dashboard</h3>
  <p>Logged in as Administrator</p>
  <input type="text" id="new-name" placeholder="New member name">
  <button onclick="addMember()">Add Member</button>
  <div id="members-list"></div>
  <button onclick="goMenu()">Back to Menu</button>
</div>

<div class="card hidden" id="member-page">
  <h3 id="welcome-name">Welcome</h3>
  <p>You are logged in.</p>
  <button onclick="goMenu()">Back to Menu</button>
</div>

<script>
const members = JSON.parse(localStorage.getItem('nhs_members') || '[]');
function save(){ localStorage.setItem('nhs_members', JSON.stringify(members)); }

function show(id){
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function goMenu(){
  if(document.getElementById('sec-code') && document.getElementById('sec-code').value.trim() !== '123456' && document.getElementById('security').classList.contains('hidden') === false){
    document.getElementById('sec-err').innerText = 'Invalid security code';
    return;
  }
  show('menu');
}

function goMemberLogin(){
  show('member-login');
  loadNames();
}

function goAdminLogin(){
  show('admin-login');
}

function loadNames(){
  const sel = document.getElementById('m-name');
  sel.innerHTML = '<option value="">Select Name</option>';
  members.forEach(m => {
    const o = document.createElement('option');
    o.value = m.name; o.textContent = m.name; sel.appendChild(o);
  });
}

function addMember(){
  const name = document.getElementById('new-name').value.trim();
  if(!name) return;
  if(members.find(m => m.name === name)){ alert('Name already exists'); return; }
  members.push({name, password:'123456'});
  save();
  document.getElementById('new-name').value = '';
  alert('Member added. Password is 123456');
  showMembers();
}

function showMembers(){
  const div = document.getElementById('members-list');
  div.innerHTML = '<h4>Members:</h4>';
  members.forEach(m => div.innerHTML += '<div>' + m.name + '</div>');
}

function doAdminLogin(){
  const name = document.getElementById('a-name').value.trim();
  const pass = document.getElementById('a-pass').value;
  const id = document.getElementById('a-id').value.trim();
  if(name && pass === '123456' && id === '123456'){
    show('admin-dash');
    showMembers();
  } else {
    document.getElementById('a-err').innerText = 'Invalid name, password or ID';
  }
}

function doMemberLogin(){
  const name = document.getElementById('m-name').value;
  const pass = document.getElementById('m-pass').value;
  const m = members.find(x => x.name === name && x.password === pass);
  if(m){
    document.getElementById('welcome-name').textContent = 'Welcome ' + m.name;
    show('member-page');
  } else {
    document.getElementById('m-err').innerText = 'Invalid name or password';
  }
}
</script>
</body>
</html>
