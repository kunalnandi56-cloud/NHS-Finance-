<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhseccs Private Banking</title>
<style>
body{font-family:Arial,sans-serif;background:#e8f4ff;padding:20px;}
.card{background:#fff;border-radius:12px;padding:20px;max-width:500px;margin:20px auto;box-shadow:0 4px 15px rgba(0,0,0,.1);}
h1{text-align:center;color:#8b6914;}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
button{width:100%;padding:12px;background:#c9a227;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;}
.error{color:red;text-align:center;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="card" id="sec">
  <h1>Nhseccs</h1>
  <h2 style="text-align:center;">Secure Access</h2>
  <input type="password" id="code" placeholder="Security Code" maxlength="6">
  <button onclick="check()">Continue</button>
  <div id="err" class="error"></div>
</div>

<div class="card hidden" id="menu">
  <h2 style="text-align:center;">Welcome</h2>
  <button onclick="show('member')">Member Login</button>
  <button onclick="show('admin')">Administrator Login</button>
</div>

<div class="card hidden" id="member">
  <h2>Member Login</h2>
  <input type="text" id="mname" placeholder="Name">
  <input type="password" id="mpass" placeholder="Password">
  <button onclick="alert('Member login will work after full setup')">Login</button>
  <button onclick="show('menu')">Back</button>
</div>

<div class="card hidden" id="admin">
  <h2>Administrator Login</h2>
  <input type="text" id="aname" placeholder="Name">
  <input type="password" id="apass" placeholder="Password">
  <input type="text" id="aid" placeholder="ID" maxlength="6">
  <button onclick="alert('Admin login will work after full setup')">Authenticate</button>
  <button onclick="show('menu')">Back</button>
</div>

<script>
function show(id){
  document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function check(){
  var c = document.getElementById('code').value.trim();
  if(c==='123456'){ show('menu'); }
  else { document.getElementById('err').innerText = 'Invalid security code'; }
}
</script>
</body>
</html>
