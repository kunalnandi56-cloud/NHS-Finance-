<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhseccs</title>
<style>
body{font-family:Arial;background:#e8f0f8;padding:20px;text-align:center;}
.box{background:#fff;padding:30px;border-radius:12px;max-width:400px;margin:40px auto;box-shadow:0 4px 15px rgba(0,0,0,.1);}
input{width:90%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;}
button{width:90%;padding:12px;background:#c9a227;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="box" id="sec">
  <h2>Security Gate</h2>
  <input type="password" id="code" placeholder="6-digit code" maxlength="6">
  <br>
  <button onclick="if(document.getElementById('code').value.trim()==='123456'){document.getElementById('sec').style.display='none';document.getElementById('menu').style.display='block';}else{alert('Invalid');}">Continue</button>
</div>

<div class="box hidden" id="menu">
  <h2>Welcome</h2>
  <button onclick="alert('Member Login')">Member Login</button>
  <br><br>
  <button onclick="alert('Administrator Login')">Administrator Login</button>
</div>
</body>
</html>
