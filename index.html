<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhseccs Private Banking</title>
<style>
body{font-family:'Times New Roman',Times,serif;background:#e8f0f8;margin:0;padding:20px;font-size:14pt;}
.header{background:#0d2b4a;color:#fff;text-align:center;padding:15px;border-radius:8px;margin-bottom:20px;}
.card{background:#fff;padding:20px;border-radius:12px;max-width:600px;margin:15px auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-family:'Times New Roman',Times,serif;font-size:14pt;}
button{padding:10px 14px;background:#c9a227;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px;font-family:'Times New Roman',Times,serif;font-size:14pt;}
.btn-full{width:100%;display:block;}
.btn-dark{background:#0d2b4a;color:#fff;}
.btn-pink{background:#f8d7da;color:#721c24;}
.hidden{display:none;}
.bottom-btns{display:flex;gap:8px;margin-top:20px;}
.bottom-btns button{flex:1;}
</style>
</head>
<body>
<div class="header">
  <h2>Nhseccs Private Banking</h2>
  <h3>NEBADHAI HIGH SCHOOL</h3>
  <p>Employees Co-operative Credit Society Limited</p>
</div>

<div class="card" id="first">
  <h3>Society code</h3>
  <input type="password" id="scode" placeholder="Society code">
  <button class="btn-full btn-dark" onclick="openMain()">Open</button>
  <button class="btn-full" onclick="alert('Install app')">Install app</button>
</div>

<div class="card hidden" id="main">
  <h3>Main</h3>
  <button class="btn-full btn-dark" onclick="showPage('member-login')">Member Login</button>
  <button class="btn-full btn-pink" onclick="showPage('admin-login')">Administrator Login</button>
  <div class="bottom-btns">
    <button onclick="showPage('first')">Logout</button>
    <button onclick="showPage('first')">Back</button>
  </div>
</div>

<div class="card hidden" id="admin-login">
  <h3>Administrator Login</h3>
  <div style="display:flex;gap:10px;">
    <select id="year"><option>2026</option><option>2025</option><option>2027</option></select>
    <select id="month"><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
  </div>
  <button class="btn-full" onclick="showPage('add-members')">Add members</button>
  <button class="btn-full btn-dark" onclick="showPage('excel')">Open Excel sheet</button>
  <div class="bottom-btns">
    <button onclick="showPage('first')">Logout</button>
    <button onclick="showPage('main')">Back</button>
  </div>
</div>

<div class="card hidden" id="add-members">
  <h3>Add members</h3>
  <input type="text" id="m-name" placeholder="Member name" oninput="this.value=this.value.toUpperCase()">
  <button class="btn-full" onclick="addMember()">Add member</button>
  <div id="m-list" style="margin-top:15px;"></div>
  <div class="bottom-btns">
    <button onclick="showPage('first')">Logout</button>
    <button onclick="showPage('admin-login')">Back</button>
    <button onclick="saveMembers()">Save</button>
  </div>
</div>

<div class="card hidden" id="excel">
  <h3>Excel Sheet</h3>
  <div id="excel-table"></div>
  <div class="bottom-btns">
    <button onclick="showPage('first')">Logout</button>
    <button onclick="showPage('admin-login')">Back</button>
  </div>
</div>

<script>
let members = JSON.parse(localStorage.getItem('nhs_members') || '[]');

function showPage(id){
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id === 'add-members') showList();
  if(id === 'excel') showExcel();
}

function openMain(){
  if(document.getElementById('scode').value.trim() === '123456') showPage('main');
  else alert('Invalid society code');
}

function addMember(){
  const name = document.getElementById('m-name').value.trim().toUpperCase();
  if(!name){ alert('Enter a name'); return; }
  if(members.find(m => m.name === name)){ alert('Name exists'); return; }
  members.push({name:name});
  document.getElementById('m-name').value = '';
  showList();
  alert('Member added: ' + name);
}

function showList(){
  const div = document.getElementById('m-list');
  div.innerHTML = '';
  members.forEach((m, i) => {
    div.innerHTML += '<div style="padding:8px 0;border-bottom:1px solid #eee;">' + (i+1) + '. ' + m.name + '</div>';
  });
}

function saveMembers(){
  localStorage.setItem('nhs_members', JSON.stringify(members));
  alert('Saved');
}

function showExcel(){
  const div = document.getElementById('excel-table');
  let html = '<table border="1" style="width:100%;border-collapse:collapse;"><tr><th>Name</th></tr>';
  members.forEach(m => html += '<tr><td>' + m.name + '</td></tr>');
  html += '</table>';
  div.innerHTML = html;
}
</script>
</body>
</html>
